[project]
name = "api-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.11",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
