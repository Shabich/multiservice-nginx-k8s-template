# Mounted only by docker compose: proxies API calls like the Kubernetes Ingress does.
location /api/py/ {
    proxy_pass http://api-python:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /api/nest/ {
    proxy_pass http://api-nest:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
