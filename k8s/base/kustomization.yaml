apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: react-nginx-k8s-template
    includeSelectors: false

resources:
  - frontend.yaml
  - api-python.yaml
  - api-nest.yaml
  - postgres.yaml
  - ingress.yaml

configMapGenerator:
  # Served as /config/env.js by the frontend (runtime config, no rebuild per environment)
  - name: frontend-config
    files:
      - env.js
