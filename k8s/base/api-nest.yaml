apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-nest
  labels:
    app.kubernetes.io/name: api-nest
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: api-nest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-nest
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-nest
          image: api-nest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-nest
  labels:
    app.kubernetes.io/name: api-nest
spec:
  selector:
    app.kubernetes.io/name: api-nest
  ports:
    - name: http
      port: 80
      targetPort: http
